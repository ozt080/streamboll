<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamboll - Live</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #000; color: #fff; }
        #video { width: 100%; max-width: 900px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,123,255,0.5); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">STREAMBOLL</span>
    </div>
</nav>

<div class="container text-center">
    <video id="video" controls></video>
    <div class="mt-4">
        <input type="text" id="streamUrl" class="form-control mb-2" placeholder="Collez votre lien .m3u8 ici">
        <button onclick="loadStream()" class="btn btn-primary w-100">Lancer la chaîne</button>
    </div>
</div>

<script>
  function loadStream() {
    var video = document.getElementById('video');
    var url = document.getElementById('streamUrl').value;
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    }
  }
</script>

</body>
</html>
