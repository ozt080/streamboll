<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamboll | Streaming Gratuit</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --main-red: #e50914; --bg-black: #050505; --card-dark: #121212; }
        body { background: var(--bg-black); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        /* Navbar de luxe */
        .navbar { background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent) !important; padding: 20px 0; }
        .navbar-brand { color: var(--main-red) !important; font-weight: 800; font-size: 1.8rem; letter-spacing: -1px; }

        /* Lecteur Vidéo Cinéma */
        .video-box { 
            position: sticky; top: 0; z-index: 1000; background: #000;
            box-shadow: 0 4px 30px rgba(229, 9, 20, 0.2); border-bottom: 3px solid var(--main-red);
        }
        #video { width: 100%; aspect-ratio: 16/9; max-height: 55vh; }

        /* Loader personnalisé */
        .loader-ring { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; }

        /* Cartes Style Netflix */
        .section-title { font-size: 1.4rem; font-weight: 700; margin: 30px 0 15px; padding-left: 10px; border-left: 4px solid var(--main-red); }
        .movie-card {
            background: var(--card-dark); border: none; border-radius: 10px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; overflow: hidden; position: relative;
        }
        .movie-card:hover { transform: scale(1.08); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 5; border: 1px solid #444; }
        .card-img { height: 180px; object-fit: contain; padding: 20px; background: #1a1a1a; }
        .vod-img { height: 260px; object-fit: cover; }
        .card-body { padding: 12px; background: linear-gradient(to top, #000, transparent); }
        .card-title { font-size: 0.8rem; font-weight: bold; text-align: center; margin: 0; }

        /* Barre de recherche futuriste */
        .search-container { margin-top: -20px; position: relative; z-index: 1002; }
        .search-input { 
            background: #222 !important; border: 1px solid #444 !important; color: white !important;
            border-radius: 50px !important; padding: 12px 25px !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container text-center justify-content-center">
        <a class="navbar-brand" href="#">STREAMBOLL</a>
    </div>
</nav>

<div class="video-box">
    <div id="loader" class="loader-ring">
        <div class="spinner-border text-danger" style="width: 4rem; height: 4rem;" role="status"></div>
    </div>
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="container search-container">
    <input type="text" id="searchBar" class="form-control search-input" placeholder="🔍 Rechercher une chaîne, un film..." onkeyup="search()">
</div>

<div class="container pb-5">
    <h2 class="section-title">TV EN DIRECT</h2>
    <div class="row g-3" id="tvGrid"></div>

    <h2 class="section-title">FILMS & SÉRIES</h2>
    <div class="row g-3" id="vodGrid"></div>
</div>

<script>
    const tvChannels = [
        { name: "France 24", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/France_24_logo.svg/512px-France_24_logo.svg.png", url: "https://static.france24.com/live/F24_FR_LO_HLS/live_tv.m3u8" },
        { name: "Arte", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Arte_logo.svg/512px-Arte_logo.svg.png", url: "https://artelive-lh.akamaihd.net/i/artelive_fr@393592/master.m3u8" },
        { name: "Euronews", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/Euronews_logo_2016.svg/512px-Euronews_logo_2016.svg.png", url: "https://euronews-euronews-french-3-fr.samsung.wurl.tv/playlist.m3u8" }
    ];

    const vodContent = [
        { name: "Tears of Steel (VOD)", poster: "https://upload.wikimedia.org/wikipedia/commons/6/6b/Tears_of_Steel_poster.jpg", url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" },
        { name: "Sintel (Film)", poster: "https://upload.wikimedia.org/wikipedia/commons/9/94/Sintel_Poster.jpg", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" }
    ];

    const tvGrid = document.getElementById('tvGrid');
    const vodGrid = document.getElementById('vodGrid');
    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    let hls = new Hls();

    function render(filter = "") {
        tvGrid.innerHTML = "";
        vodGrid.innerHTML = "";

        tvChannels.forEach(c => {
            if(c.name.toLowerCase().includes(filter.toLowerCase())) {
                tvGrid.innerHTML += `
                <div class="col-6 col-md-3">
                    <div class="card movie-card" onclick="play('${c.url}')">
                        <img src="${c.logo}" class="card-img">
                        <div class="card-body"><h5 class="card-title">${c.name}</h5></div>
                    </div>
                </div>`;
            }
        });

        vodContent.forEach(v => {
            if(v.name.toLowerCase().includes(filter.toLowerCase())) {
                vodGrid.innerHTML += `
                <div class="col-6 col-md-3">
                    <div class="card movie-card" onclick="play('${v.url}')">
                        <img src="${v.poster}" class="card-img vod-img">
                        <div class="card-body"><h5 class="card-title">${v.name}</h5></div>
                    </div>
                </div>`;
            }
        });
    }

    function search() { render(document.getElementById('searchBar').value); }

    function play(url) {
        loader.style.display = "block";
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); loader.style.display="none"; });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
            video.onplaying = () => loader.style.display="none";
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    render();
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
