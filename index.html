<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamboll - IPTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; }
        .video-section { position: sticky; top: 0; z-index: 100; background: #121212; padding-bottom: 10px; }
        #video { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #0d6efd; }
        .channel-list { padding: 15px; }
        .btn-channel { 
            text-align: left; 
            margin-bottom: 10px; 
            background: #1e1e1e; 
            border: 1px solid #333; 
            color: white;
            transition: 0.3s;
        }
        .btn-channel:hover { background: #0d6efd; border-color: #0d6efd; }
    </style>
</head>
<body>

<div class="video-section">
    <video id="video" controls></video>
    <div class="container mt-2">
        <h4 id="currentChannel">Sélectionnez une chaîne</h4>
    </div>
</div>

<div class="container channel-list">
    <div class="row" id="buttonsContainer">
        <!-- Les boutons vont s'afficher ici -->
    </div>
</div>

<script>
    // LISTE DES CHAÎNES (Tu peux en ajouter ici)
    // Note : Ce sont des flux légaux et gratuits pour l'exemple
    const channels = [
        { name: "France 24 (Infos)", url: "https://static.france24.com/live/F24_FR_LO_HLS/live_tv.m3u8" },
        { name: "Arte (Culture)", url: "https://artelive-lh.akamaihd.net/i/artelive_fr@393592/master.m3u8" },
        { name: "Euronews", url: "https://euronews-euronews-french-3-fr.samsung.wurl.tv/playlist.m3u8" },
        { name: "Bfm Business", url: "https://alticebfmbusiness-hls-live-m6-v4-aka.akamaized.net/out/v1/7994849ecb3c4bd389965d1d6a89c961/index.m3u8" }
    ];

    const video = document.getElementById('video');
    const container = document.getElementById('buttonsContainer');
    const title = document.getElementById('currentChannel');
    let hls = new Hls();

    // Création automatique des boutons
    channels.forEach(chan => {
        let col = document.createElement('div');
        col.className = 'col-6 col-md-4';
        col.innerHTML = `<button class="btn btn-channel w-100" onclick="play('${chan.url}', '${chan.name}')">${chan.name}</button>`;
        container.appendChild(col);
    });

    function play(url, name) {
        title.innerText = "Lecture : " + name;
        if (Hls.isSupported()) {
            hls.destroy(); // On nettoie l'ancienne lecture
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Pour Safari (iPhone)
            video.src = url;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    }
</script>

</body>
</html>
